[package]
name = "skald-view"
version = "1.0.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
description = "A strict PDF 2.0 renderer for controlled Skald documents"
repository = "https://github.com/beint-no/skald-view"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
vello_cpu = { version = "0.3", default-features = false, features = ["std", "u8_pipeline"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
brotli-decompressor = "6"
jxl = { version = "0.8", default-features = false, features = ["simd128", "neon", "sse42", "avx"] }
zune-jpeg = "0.5"
ttf-parser = "0.25"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
thiserror = "2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"

[dev-dependencies]
proptest = "1"
png = "0.18"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"

[[bench]]
name = "pipeline"
harness = false
