<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Skald View</title>
    <link rel="stylesheet" href="./embed.css" />
    <script type="module" src="./embed.mjs"></script>
  </head>
  <body>
    <nav aria-label="PDF controls">
      <button id="previous" aria-label="Previous page">←</button
      ><input
        id="page"
        type="number"
        min="1"
        value="1"
        aria-label="Page"
      /><output id="count"></output
      ><button id="next" aria-label="Next page">→</button
      ><button id="out" aria-label="Zoom out">−</button
      ><output id="zoom"></output><button id="in" aria-label="Zoom in">+</button
      ><button id="fit">Fit width</button
      ><a id="original" target="_blank" rel="noopener noreferrer"
        >Open original</a
      >
    </nav>
    <p id="status" role="status" aria-live="polite"></p>
    <div id="viewport">
      <div id="paper">
        <canvas id="canvas" aria-hidden="true"></canvas>
        <div id="text" role="document"></div>
        <div id="links"></div>
      </div>
      <p id="error" role="alert" hidden></p>
    </div>
  </body>
</html>
