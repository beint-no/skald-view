name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  engine-and-browser:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '26'
          cache: npm
      - name: Set up pinned Rust
        run: rustup show
      - name: Native tests and lint
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
      - name: Install matching wasm-bindgen CLI
        run: |
          curl --fail --location --output /tmp/bindgen.tar.gz https://github.com/wasm-bindgen/wasm-bindgen/releases/download/0.2.130/wasm-bindgen-0.2.130-x86_64-unknown-linux-musl.tar.gz
          curl --fail --location --output /tmp/bindgen.sha256 https://github.com/wasm-bindgen/wasm-bindgen/releases/download/0.2.130/wasm-bindgen-0.2.130-x86_64-unknown-linux-musl.tar.gz.sha256sum
          expected=$(cut -d ' ' -f 1 /tmp/bindgen.sha256)
          actual=$(sha256sum /tmp/bindgen.tar.gz | cut -d ' ' -f 1)
          test "$expected" = "$actual"
          tar -xzf /tmp/bindgen.tar.gz -C /tmp
          echo /tmp/wasm-bindgen-0.2.130-x86_64-unknown-linux-musl >> "$GITHUB_PATH"
      - name: Build browser library and test queue
        run: |
          npm ci --ignore-scripts
          npm test
          npm run build
          cargo clippy --locked --target wasm32-unknown-unknown --lib -- -D warnings
      - name: Install browser engines
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Three-browser tests
        run: npm run test:browser -- --workers=2
      - name: Native performance probe
        run: |
          mkdir -p bench-results
          cargo bench --bench pipeline > bench-results/native.csv
      - name: Upload inspection artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: inspection-artifacts
          path: |
            test-results/
            bench-results/
            web/pkg/
          retention-days: 7
