name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '26'
          cache: npm
      - name: Pinned toolchain and reference renderer
        run: |
          rustup show
          sudo apt-get update
          sudo apt-get install --yes mupdf-tools
      - name: Validate native engine
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
      - name: Matching wasm-bindgen CLI
        run: |
          curl -fL -o /tmp/bindgen.tar.gz https://github.com/wasm-bindgen/wasm-bindgen/releases/download/0.2.130/wasm-bindgen-0.2.130-x86_64-unknown-linux-musl.tar.gz
          curl -fL -o /tmp/bindgen.sha256 https://github.com/wasm-bindgen/wasm-bindgen/releases/download/0.2.130/wasm-bindgen-0.2.130-x86_64-unknown-linux-musl.tar.gz.sha256sum
          expected=$(cut -d ' ' -f 1 /tmp/bindgen.sha256)
          actual=$(sha256sum /tmp/bindgen.tar.gz | cut -d ' ' -f 1)
          test "$expected" = "$actual"
          tar -xzf /tmp/bindgen.tar.gz -C /tmp
          echo /tmp/wasm-bindgen-0.2.130-x86_64-unknown-linux-musl >> "$GITHUB_PATH"
      - name: Build and validate browser distribution
        run: |
          npm ci --ignore-scripts
          npm test
          npm run format:check
          npm run build
          cargo clippy --locked --target wasm32-unknown-unknown --lib -- -D warnings
          npx playwright install --with-deps chromium firefox webkit
          npm run test:browser -- --workers=2
          npm run verify:corpus
      - name: Create versioned archive
        run: |
          node --input-type=module -e 'import fs from "node:fs"; const v=JSON.parse(fs.readFileSync("package.json")).version;if(process.env.GITHUB_REF_NAME!==`v${v}`)process.exit(1);'
          npm run package
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.sha256 --verify-tag --title "Skald View $GITHUB_REF_NAME" --notes-file "docs/releases/${GITHUB_REF_NAME#v}.md"
